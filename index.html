Chú có cái mào đỏ chót như bông hoa mào gà. Lông chú vàng óng, óng ả như nắng sớm. Đuôi chú cong vút, lông đen pha xanh biếc. Chân chú vàng, có cựa nhọn. Mỗi sáng, chú gáy ò ó o thật to để gọi cả nhà dậy.

Gà mái thì khác. Cô gà mái mơ cục tác trong ổ rơm. Cô dẫn đàn con bé xíu, lông vàng như kén, đi bới đất tìm giun. Khi có con quạ bay qua, gà mẹ xù lông, dang cánh che cho con.

Chiều nào em cũng cho gà ăn thóc. Em vãi thóc ra sân, gà chạy lại mổ tí tách. Em còn vuốt ve bộ lông mềm của chú gà trống. Chú nhìn em, mắt tròn xoe.

Em rất yêu đàn gà nhà em. Nhờ có đàn gà mà nhà em lúc nào cũng vui và ấm áp. Em sẽ chăm sóc gà thật tốt để gà mau lớn.`;if(u)return`Trong góc sân nhỏ nhà em có một đàn gà. Em yêu nhất chú gà trống oai vệ.

Chú mang chiếc mào đỏ rực như đốm lửa. Bộ lông vàng óng ả, mỗi khi nắng chiếu lại lấp lánh. Chiếc đuôi cong vút như một dải lụa đen ánh xanh. Sáng nào chú cũng đứng trên đống rơm, vươn cổ gáy ò ó o. Tiếng gáy của chú trong trẻo, đánh thức cả xóm.

Gà mái mơ thì dịu dàng hơn. Cô nằm ấp trứng trong ổ rơm ấm. Khi đàn con nở, cô cục tác gọi con, dẫn chúng đi khắp vườn. Đàn gà con líu ríu như những cuộn bông vàng biết đi.
