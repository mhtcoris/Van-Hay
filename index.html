":"tôi",p=l||u?"Em":"Tôi";if(e==="ga"){if(l)return`Nhà em có nuôi một đàn gà. Trong đàn, em thích nhất là chú gà trống.

Chú có cái mào đỏ chót như bông hoa mào gà. Lông chú vàng óng, óng ả như nắng sớm. Đuôi chú cong vút, lông đen pha xanh biếc. Chân chú vàng, có cựa nhọn. Mỗi sáng, chú gáy ò ó o thật to để gọi cả nhà dậy.

Gà mái thì khác. Cô gà mái mơ cục tác trong ổ rơm. Cô dẫn đàn con bé xíu, lông vàng như kén, đi bới đất tìm giun. Khi có con quạ bay qua, gà mẹ xù lông, dang cánh che cho con.

Chiều nào em cũng cho gà ăn thóc. Em vãi thóc ra sân, gà chạy lại mổ tí tách. Em còn vuốt ve bộ lông mềm của chú gà trống. Chú nhìn em, mắt tròn xoe.

Em rất yêu đàn gà nhà em. Nhờ có đàn gà mà nhà em lúc nào cũng vui và ấm áp. Em sẽ chăm sóc gà thật tốt để gà mau lớn.`;if(u)return`Trong góc sân nhỏ nhà em có một đàn gà. Em yêu nhất chú gà trống oai vệ.

Chú mang chiếc mào đỏ rực như đốm lửa. Bộ lông vàng óng ả, mỗi khi nắng chiếu lại lấp lánh. Chiếc đuôi cong vút như một dải lụa đen ánh xanh. Sáng nào chú cũng đứng trên đống rơm, vươn cổ gáy ò ó o. Tiếng gáy của chú trong trẻo, đánh thức cả xóm.

Gà mái mơ thì dịu dàng hơn. Cô nằm ấp trứng trong ổ rơm ấm. Khi đàn con nở, cô cục tác gọi con, dẫn chúng đi khắp vườn. Đàn gà con líu ríu như những cuộn bông vàng biết đi.

Em thường cho gà ăn thóc, thỉnh thoảng em còn băm thêm rau cho chúng. Nhìn chúng mổ thóc tí tách, em thấy lòng mình vui lạ. Em vuốt ve chú trống, cảm giác ấm áp lan ra tay.

Đối với em, tiếng gà gáy không chỉ là âm thanh của buổi sớm mà còn là tiếng của quê nhà, của sự bình yên. Em sẽ luôn chăm sóc đàn gà như một người bạn nhỏ.`;if(o)return`${n} – nghe giản dị nhưng ẩn chứa nhiều biểu tượng. Với tôi, hình ảnh con gà trống đã trở thành một lát cắt của ký ức làng quê.

Mở bài gián tiếp: Người ta hay nói về bình minh bằng ánh sáng, nhưng với tôi, bình minh bắt đầu bằng tiếng gáy. Chú gà trống nhà tôi có mào đỏ chót như một đốm than hồng, lông vàng óng như vừa gội nắng. Đuôi cong vút, ánh lên màu thép. Mỗi sớm, nó đứng trên bờ tường, ngửa cổ, dõng dạc gáy ò ó o – một tiếng gọi dứt khoát, xé tan màn sương.

Gà mái và đàn con lại gợi ra một triết lý khác về sự chở che. Cô gà mái mơ không sặc sỡ nhưng bền bỉ, cục tác suốt ngày, dẫn đàn con bới đất. Khi diều hâu lượn qua, nó xù lông, dang cánh – hành động bản năng nhưng chứa đựng tình mẫu tử thiêng liêng. Tôi nhận ra, trong cái sân nhỏ ấy có cả một bài học về trách nhiệm.

Từ việc cho gà ăn thóc mỗi chiều, tôi học được sự kiên nhẫn. Không thể vội vàng khi vãi thóc; phải chờ gà tụ lại, phải quan sát con nào yếu để chăm riêng. Đó cũng là cách Edison từng kiên trì với hàng nghìn thí nghiệm, hay Nguyễn Ngọc Ký kiên trì tập viết bằng chân. Giá trị không nằm ở tiếng gáy vang, mà ở sự đều đặn mỗi ngày.

Kết lại, con gà trống không chỉ báo thức. Nó nhắc tôi rằng mỗi người cũng cần một tiếng gáy của riêng mình – đánh thức mình dậy, đánh thức người khác bằng sự chăm chỉ. Tôi yêu tiếng gáy ấy, vì nó giữ cho tôi không ngủ quên trên hành trình lớn lên.`;return`Tôi đã đi qua nhiều thành phố, nghe nhiều tiếng chuông báo thức điện tử, nhưng không âm thanh nào ám ảnh như tiếng gà gáy trong ký ức. Vũ Bằng từng viết về phở, về cốm, còn tôi, tôi muốn viết về con gà trống của bà.

Nó không đẹp theo kiểu trưng trổ. Cái mào đỏ sần sùi như một vết cắt của hoàng hôn, bộ lông vàng pha mật ong đã xỉn đi vì nắng mưa. Đuôi nó cong, nhưng không phải cái cong điệu đà của gà chọi kiểng, mà là cái cong của một lưỡi liềm đã mòn. Sáng nào cũng vậy, nó trèo lên đống củi, rướn cổ, và tiếng gáy của nó không phải ò ó o tròn vành, mà khàn khàn, đứt quãng như một lời nhắc đã cũ.
